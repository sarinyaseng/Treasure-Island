<!doctype html>
<html lang="th" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treasure Island | เกาะมหาสมบัติ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen text-stone-100">
  <main id="app" class="app-shell">
    <section id="authView" class="auth-view scene-bg">
      <div class="auth-panel animate__animated animate__fadeIn">
        <div class="flex items-center gap-3">
          <i data-lucide="ship-wheel" class="text-amber-300"></i>
          <span class="tracking-[0.35em] text-xs uppercase text-amber-200">เกมนวนิยายเชิงโต้ตอบ</span>
        </div>
        <h1>Treasure Island</h1>
        <p class="text-stone-300">เกมนวนิยายเชิงโต้ตอบ เรื่อง ปริศนาขุมทรัพย์โจรสลัด</p>
        <div class="tabs tabs-boxed bg-black/30 mt-6">
          <button class="tab tab-active" data-auth-tab="login">เข้าสู่ระบบ</button>
          <button class="tab" data-auth-tab="register">สมัครสมาชิก</button>
        </div>
        <form id="authForm" class="grid gap-3 mt-4">
          <input id="username" class="input input-bordered bg-black/40" placeholder="ชื่อผู้ใช้" autocomplete="username" required>
          <input id="password" class="input input-bordered bg-black/40" placeholder="รหัสผ่าน" type="password" autocomplete="current-password" required>
          <button id="authSubmit" class="btn btn-warning">เริ่มผจญภัย</button>
          <button id="demoLogin" type="button" class="btn btn-ghost">เล่นโหมดทดลองในเครื่อง</button>
        </form>
        <div class="flex items-center justify-between mt-5 text-sm text-stone-300">
          <label class="flex items-center gap-2 cursor-pointer">
            <input id="musicToggle" type="checkbox" class="toggle toggle-warning">
            เสียงบรรยากาศ
          </label>
          <a href="admin.html" class="link link-warning">แดชบอร์ดผู้ดูแล</a>
        </div>
      </div>
    </section>

    <section id="menuView" class="hidden menu-view scene-bg">
      <div class="menu-panel animate__animated animate__fadeInUp">
        <p id="welcomeText" class="text-amber-200 uppercase tracking-[0.3em] text-xs"></p>
        <h2>เมนูหลัก</h2>
        <div class="grid gap-3 mt-6">
          <button id="continueBtn" class="btn btn-warning"><i data-lucide="play"></i>เล่นต่อ</button>
          <button id="newGameBtn" class="btn btn-outline btn-warning"><i data-lucide="sparkles"></i>เริ่มเกมใหม่</button>
          <button id="logoutBtn" class="btn btn-ghost"><i data-lucide="log-out"></i>ออกจากระบบ</button>
        </div>
      </div>
    </section>

    <section id="gameView" class="hidden game-view">
      <div id="sceneBackdrop" class="scene-backdrop"></div>
      <div class="hud">
        <button id="menuBtn" class="icon-btn" title="เมนูหลัก"><i data-lucide="chevron-left"></i></button>
        <div>
          <p id="sceneType" class="hud-kicker"></p>
          <h2 id="sceneTitle"></h2>
        </div>
        <div class="score-strip hidden">
          <span>AS <b id="totalAC">0</b></span>
          <span>MS <b id="totalMC">0</b></span>
          <span>LPS <b id="totalLPS">0</b></span>
        </div>
      </div>

      <div class="story-stage">
        <div class="video-frame">
          <video id="sceneVideo" playsinline></video>
          <div id="imageScene" class="image-scene"></div>
        </div>
        <article id="choicePanel" class="choice-panel animate__animated">
          <p id="sceneText"></p>
          <div id="choices" class="choice-list"></div>
          <div class="choice-actions">
            <button id="replayBtn" class="btn btn-ghost"><i data-lucide="rotate-ccw"></i>เล่นซ้ำ</button>
            <button id="confirmBtn" class="btn btn-warning" disabled><i data-lucide="lock"></i>ยืนยัน</button>
            <button id="saveBtn" class="btn btn-outline btn-warning" disabled><i data-lucide="save"></i>บันทึกเกม</button>
          </div>
        </article>
      </div>
    </section>

    <dialog id="endingModal" class="modal">
      <div class="modal-box bg-stone-950 border border-amber-500/30">
        <h3 id="endingTitle" class="font-bold text-2xl text-amber-200"></h3>
        <p id="endingText" class="py-4"></p>
        <div class="stats stats-vertical lg:stats-horizontal w-full bg-black/30 hidden">
          <div class="stat"><div class="stat-title">AS</div><div id="endAC" class="stat-value text-warning">0</div></div>
          <div class="stat"><div class="stat-title">MS</div><div id="endMC" class="stat-value text-info">0</div></div>
          <div class="stat"><div class="stat-title">LPS</div><div id="endLPS" class="stat-value text-success">0</div></div>
        </div>
        <div class="modal-action">
          <button id="restartBtn" class="btn btn-warning">เริ่มใหม่</button>
        </div>
      </div>
    </dialog>

    <div id="toast" class="toast toast-top toast-end"></div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
